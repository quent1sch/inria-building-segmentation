[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    --tb=short
    -v
    --strict-markers

# Markers
markers =
    unit: pure unit tests, no external dependencies
    integration: requires running container or DB

# Async support
asyncio_mode = auto